<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    rect {
      stroke: #000;
    }

    .dot {
      fill: #000;
    }

    @media (prefers-color-scheme: dark) {
      rect {
        stroke: #fff;
      }

      .dot {
        fill: #fff;
      }
    }
  </style>

  <rect x="7" y="7" width="18" height="18" stroke-width="2"/>
  <rect x="11" y="11" width="10" height="10" stroke-width="2"/>

  <rect class="dot" x="4" y="4" width="3" height="3"/>
  <rect class="dot" x="25" y="4" width="3" height="3"/>
  <rect class="dot" x="4" y="25" width="3" height="3"/>
  <rect class="dot" x="25" y="25" width="3" height="3"/>
</svg>